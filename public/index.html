<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #3B6FD4; --accent-bg: #EEF3FB; --accent-border: #BFCFEF; --accent-dark: #1E3A6E;
  --warm: #FFFBF5; --text: #1a1a1a; --muted: #6B7280; --dim: #9CA3AF;
  --border: #E5E7EB; --surface: #ffffff; --bg: #FAFAF8; --radius: 6px;
}
body { font-family: 'Inter', sans-serif; background: #fff; color: #111; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 48px; border-bottom: 1px solid #E8E8E8; background: #fff; position: sticky; top: 0; z-index: 50; }
.wordmark { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.wordmark-bar { width: 7px; height: 34px; background: #3B6FD4; border-radius: 2px; flex-shrink: 0; }
.wordmark-text { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 900; letter-spacing: -2px; color: #111; line-height: 1; }
.wordmark-text span { color: #3B6FD4; }

.nav-links { display: flex; gap: 28px; list-style: none; }
.nav-links a { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.15s; cursor: pointer; }
.nav-links a:hover, .nav-links a.active { color: var(--text); }
.nav-cart { font-size: 13px; font-weight: 600; color: var(--text); border: 1px solid var(--border); padding: 7px 16px; border-radius: var(--radius); cursor: pointer; background: none; font-family: 'Inter', sans-serif; transition: all 0.15s; }
.nav-cart:hover { border-color: var(--accent); color: var(--accent); }

/* Pages */
.page { display: none; }
.page.active { display: block; }

/* Ticker */
.disc-wrap { overflow: hidden; background: #ffffff; border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); padding: 12px 0; }
.disc-track { display: flex; white-space: nowrap; animation: ticker 30s linear infinite; }
.disc-track:hover { animation-play-state: paused; }
.disc-item { font-size: 15px; color: #1a1a1a; font-weight: 500; padding: 0 28px; }
.disc-item::after { content: '·'; margin-left: 28px; }
@keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }


/* ── Hero ─────────────────────────────────────────── */
.hero { border-bottom: 1px solid var(--border); background: #fff; }
.hero-inner { display: grid; grid-template-columns: 1fr 1fr; min-height: 560px; }
.hero-copy { display: flex; flex-direction: column; justify-content: center; padding: 80px 64px; }
.hero-copy h1 { font-family: 'Fraunces', serif; font-size: clamp(38px, 4.5vw, 60px); font-weight: 300; line-height: 1.07; letter-spacing: -2px; margin-bottom: 20px; color: #111; }
.hero-copy h1 em { font-style: italic; color: var(--accent); }
.hero-sub { font-size: 15px; color: var(--muted); line-height: 1.7; margin-bottom: 32px; max-width: 360px; }
.hero-actions { display: flex; gap: 12px; align-items: center; margin-bottom: 32px; justify-content: flex-start; }
.hero-trust { display: flex; gap: 24px; }
.hero-trust-item { font-size: 14px; color: #333; display: flex; align-items: center; gap: 7px; font-weight: 600; }
.hero-trust-item::before { content: '✓'; color: #16A34A; font-weight: 800; font-size: 15px; }

/* ── Hero COA Panel ───────────────────────────────── */
.hero-coa-panel { background: #F7F9FF; border-left: 1px solid #DDE6F5; padding: 52px 48px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
.hero-coa-header-block { display: flex; flex-direction: column; gap: 10px; }
.hero-coa-eyebrow { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.hero-coa-title { font-family: 'Fraunces', serif; font-size: clamp(28px, 3vw, 40px); font-weight: 300; letter-spacing: -1px; color: #111; line-height: 1.1; }
.hero-coa-sub { font-size: 13px; color: var(--muted); line-height: 1.65; max-width: 320px; }
.hero-coa-list { display: flex; flex-direction: column; gap: 0; border: 1px solid #DDE6F5; border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 1px 4px rgba(59,111,212,.06); }
.hero-coa-row { display: grid; grid-template-columns: 2fr 1.5fr 1fr 0.8fr; align-items: center; gap: 0; padding: 13px 18px; border-bottom: 1px solid #EEF3FB; cursor: default; }
.hero-coa-row:last-child { border-bottom: none; }
.hero-coa-row:hover { background: #F4F7FF; }
.hero-coa-product { font-size: 13px; font-weight: 600; color: #111; text-align: left; }
.hero-coa-meta { font-size: 13px; color: var(--muted); text-align: center; }
.hero-coa-purity { font-size: 13px; font-weight: 700; color: #16A34A; text-align: right; font-variant-numeric: tabular-nums; }
.hero-coa-col-hd:first-child { text-align: left; }
.hero-coa-col-hd:nth-child(2) { text-align: center; }
.hero-coa-col-hd:nth-child(3) { text-align: center; }
.hero-coa-col-hd:nth-child(4) { text-align: right; }
.hero-coa-all-btn { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #DDE6F5; color: var(--accent); padding: 11px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all .15s; width: fit-content; }
.hero-coa-all-btn:hover { border-color: var(--accent); background: var(--accent); color: #fff; }



/* ── Featured bestsellers strip ─────────────────────────── */
.featured-section { padding: 72px 48px; border-bottom: 1px solid var(--border); background: #fff; }
.section-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 40px; }
.section-label { font-size: 11px; font-weight: 600; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
.section-title { font-family: 'Fraunces', serif; font-size: 38px; font-weight: 300; letter-spacing: -1px; color: #111; }
.section-view-all { font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; background: none; border: none; font-family: 'Inter', sans-serif; }
.section-view-all:hover { color: #111; }
.featured-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); }
.featured-card { background: #fff; padding: 0; cursor: pointer; transition: background 0.12s; display: flex; flex-direction: column; }
.featured-card:hover { background: #FAFAFA; }
.featured-card-img { aspect-ratio: 1; overflow: hidden; background: #F7F5F2; }
.featured-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
.featured-card:hover .featured-card-img img { transform: scale(1.03); }
.featured-card-body { padding: 24px; border-top: 1px solid var(--border); flex: 1; display: flex; flex-direction: column; }
.featured-card-cat { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.featured-card-name { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 400; color: #111; margin-bottom: 6px; }
.featured-card-dose { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.featured-card-footer { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.featured-card-price { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 400; color: #111; }
.featured-card-btn { background: #111; color: #fff; border: none; padding: 10px 0; font-size: 12px; font-weight: 600; border-radius: var(--radius); cursor: pointer; font-family: 'Inter', sans-serif; letter-spacing: 0.02em; transition: opacity 0.15s; width: 100%; }
.featured-card-btn:hover { opacity: 0.75; }

/* ── Why us strip ────────────────────────────────────────── */
.why-strip { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: #fff; }
.why-item { padding: 40px 48px; border-right: 1px solid var(--border); }
.why-item:last-child { border-right: none; }
.why-icon { font-size: 22px; margin-bottom: 14px; }
.why-title { font-size: 13px; font-weight: 700; color: #111; margin-bottom: 8px; }
.why-desc { font-size: 13px; color: var(--muted); line-height: 1.65; }

/* ── Category tiles ──────────────────────────────────────── */
.cats-section { padding: 72px 48px; background: #fff; border-bottom: 1px solid var(--border); }
.cats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 40px; }
.cat-tile { border: 1px solid var(--border); border-radius: 8px; padding: 28px 24px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; background: #fff; text-align: left; }
.cat-tile:hover { border-color: #111; box-shadow: 0 0 0 1px #111; }
.cat-tile-pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; margin-bottom: 14px; }
.cat-tile-name { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 300; color: #111; margin-bottom: 6px; letter-spacing: -0.3px; }
.cat-tile-count { font-size: 13px; color: var(--muted); }

/* ── Shop section ────────────────────────────────────────── */
.shop-section { padding: 48px 48px; }
.section-sub { font-size: 13px; color: var(--muted); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
.filter-btn { padding: 8px 18px; border: 1px solid var(--border); border-radius: 100px; background: #fff; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; color: var(--muted); transition: all 0.15s; }
.filter-btn.active, .filter-btn:hover { background: #111; color: #fff; border-color: #111; }
.grid { display: block; } /* renderGrid handles layout */
.product-card { background: var(--surface); cursor: pointer; transition: background 0.12s; display: flex; flex-direction: column; }
.product-card:hover { background: #FAFAFA; }
.product-img { aspect-ratio: 1; overflow: hidden; background: #F7F5F2; width: 100%; }
.product-img img { width: 100%; height: 100%; object-fit: cover; }
.product-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
.product-cat { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.product-name { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 400; color: var(--text); margin-bottom: 4px; }
.product-dose { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.product-price { font-size: 15px; font-weight: 700; color: var(--text); }
.add-btn { background: var(--text); color: #fff; border: none; padding: 7px 14px; border-radius: var(--radius); font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.15s; }
.add-btn:hover { opacity: 0.75; }
.out-badge { font-size: 11px; color: var(--dim); font-weight: 500; }

/* ── Lab Reports ─────────────────────────────────────────── */
.lab-section { padding: 48px 48px; }
.lab-product { margin-bottom: 32px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.lab-product-header { padding: 16px 20px; background: #FAFAFA; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-start; }
.lab-product-name { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 400; color: #111; }
.lab-cat-pill { font-size: 10px; font-weight: 600; padding: 3px 10px; border-radius: 100px; letter-spacing: 0.05em; text-transform: uppercase; }
.coa-list { display: flex; flex-direction: column; }
.coa-row { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); gap: 16px; }
.coa-row:last-child { border-bottom: none; }
.coa-label { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 3px; }
.coa-meta { font-size: 12px; color: var(--muted); }
.coa-current { display: inline-block; font-size: 10px; font-weight: 700; background: #DCFCE7; color: #166534; padding: 2px 8px; border-radius: 100px; margin-left: 8px; letter-spacing: 0.04em; }
.coa-btn { font-size: 12px; font-weight: 600; color: var(--accent); background: none; border: 1px solid var(--accent); padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; }
.coa-btn:hover { background: var(--accent); color: #fff; }
.coa-download { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; padding: 6px 14px; border: 1px solid var(--accent); border-radius: 6px; }
.coa-download:hover { background: var(--accent); color: #fff; }

/* ── Product detail page ─────────────────────────────────── */
.product-page { padding: 48px 48px; }
.product-page-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: start; }
.product-page-img { aspect-ratio: 1; overflow: hidden; border-radius: 8px; background: #F7F5F2; }
.product-page-img img { width: 100%; height: 100%; object-fit: cover; }
.product-page-info { display: flex; flex-direction: column; gap: 20px; }
.product-page-cat { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.product-page-name { font-family: 'Fraunces', serif; font-size: 36px; font-weight: 300; letter-spacing: -1px; color: var(--text); line-height: 1.1; }
.product-page-dose { font-size: 14px; color: var(--muted); }
.product-page-price { font-size: 28px; font-weight: 700; color: var(--text); }
.product-page-desc { font-size: 14px; color: var(--muted); line-height: 1.7; }
.dose-select { display: flex; gap: 8px; flex-wrap: wrap; }
.dose-btn { padding: 8px 18px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; }
.dose-btn.active { border-color: #111; background: #111; color: #fff; }
.add-to-cart-btn { background: #111; color: #fff; border: none; padding: 16px 32px; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.15s; width: 100%; }
.add-to-cart-btn:hover { opacity: 0.8; }
.product-page-coas { margin-top: 8px; }
.product-page-coas h3 { font-size: 13px; font-weight: 700; margin-bottom: 12px; }

/* ── FAQ ─────────────────────────────────────────────────── */
.faq-section { padding: 64px 48px; max-width: 720px; }
.faq-item { border-bottom: 1px solid var(--border); }
.faq-q { width: 100%; text-align: left; padding: 20px 0; font-size: 15px; font-weight: 600; color: var(--text); background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; display: flex; justify-content: space-between; align-items: center; }
.faq-a { font-size: 14px; color: var(--muted); line-height: 1.7; padding-bottom: 20px; display: none; }
.faq-a.open { display: block; }

/* ── Cart drawer ─────────────────────────────────────────── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; }
.overlay.open { display: block; }
.cart-drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 420px; background: #fff; z-index: 101; transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,.12); }
.cart-drawer.open { transform: translateX(0); }
.cart-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.cart-title { font-size: 17px; font-weight: 700; color: #111; }
.cart-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; padding: 4px; }
.cart-close:hover { color: #111; }
.cart-items { flex: 1; overflow-y: auto; padding: 0 24px; }
.cart-empty { text-align: center; color: var(--muted); padding: 56px 0; font-size: 14px; }
.cart-item { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); }
.cart-item:last-child { border-bottom: none; }
.cart-item-img { width: 64px; height: 64px; border-radius: 6px; overflow: hidden; background: #F7F5F2; flex-shrink: 0; }
.cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
.cart-item-info { min-width: 0; }
.cart-item-name { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 3px; }
.cart-item-dose { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.cart-item-qty { display: flex; align-items: center; gap: 10px; }
.cart-qty-btn { background: #F5F5F5; border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; color: #111; font-weight: 600; }
.cart-qty-btn:hover { background: #E5E5E5; }
.cart-qty-num { font-size: 13px; font-weight: 600; min-width: 16px; text-align: center; }
.cart-item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.cart-item-price { font-size: 14px; font-weight: 700; color: #111; }
.cart-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px; }
.cart-remove:hover { color: #EF4444; }
#cart-footer-wrap { border-top: 1px solid var(--border); padding: 20px 24px; flex-shrink: 0; }
.cart-total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.cart-total-row span { font-size: 15px; color: var(--muted); }
.cart-total-row strong { font-size: 22px; font-weight: 700; color: #111; }
.cart-checkout-btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.15s; margin-bottom: 12px; }
.cart-checkout-btn:hover { opacity: 0.88; }
.cart-note { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.6; }
.cart-payment-note { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; line-height: 1.5; }
.empty-cart { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; }



function refreshFeatured() {
  fetch('/api/stock').then(function(r){ return r.json(); }).then(function(stock) {
    [0, 9, 11, 12].forEach(function(idx) {
      var p = PRODUCTS[idx];
      if (!p) return;
      var btn = document.getElementById('fc-btn-' + idx);
      if (!btn) return;
      var inStock = (stock[p.id] !== undefined) ? !!stock[p.id].in_stock : false;
      if (inStock) {
        btn.className = 'featured-card-btn';
        btn.textContent = 'Add to Cart';
        btn.onclick = function(e) { e.stopPropagation(); quickAdd(idx); };
        btn.disabled = false;
      } else {
        btn.className = 'notify-btn';
        btn.style.width = '100%';
        btn.textContent = 'Notify Me';
        btn.onclick = function(e) { e.stopPropagation(); openNotify(p.id, p.name + ' ' + p.dose); };
      }
    });
  }).catch(function(){});
}

// ── Shop ──
function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderGrid();
}
function renderGrid() {
  var grid = document.getElementById('grid');
  if (!grid) return;

  var countEl = document.getElementById('product-count');
  var list = activeFilter === 'all' ? PRODUCTS : PRODUCTS.filter(function(p){ return p.category === activeFilter; });
  if (countEl) countEl.textContent = list.length + ' product' + (list.length !== 1 ? 's' : '');

  var CAT_COLOURS = {
    'Metabolic Research': '#D97706',
    'Cognitive Research': '#2563EB',
    'Longevity Research': '#16A34A',
    'Growth Research':    '#7C3AED'
  };
  var CAT_BG = {
    'Metabolic Research': '#FEF3C7',
    'Cognitive Research': '#EFF6FF',
    'Longevity Research': '#F0FDF4',
    'Growth Research':    '#F5F3FF'
  };

  function cardHTML(p, idx) {
    var col = CAT_COLOURS[p.category] || '#3B6FD4';
    var bg  = CAT_BG[p.category]     || '#EEF3FB';
    var html = '<div class="card" onclick="showProduct(' + idx + ')">';
    if (p.img) html += '<img class="card-img" src="' + p.img + '" alt="' + p.name + '" loading="lazy">';
    html += '<div class="card-body">';
    html += '<span class="card-cat" style="color:' + col + ';background:' + bg + '">' + p.category + '</span>';
    html += '<div class="card-name">' + p.name + '</div>';
    html += '<div class="card-dose">' + p.dose + '</div>';
    html += '<div class="card-price">CA$' + p.price + '</div>';
    if (p.inStock) {
      html += '<button class="add-btn" onclick="event.stopPropagation();quickAdd(' + idx + ')">Add to Cart</button>';
    } else {

    }
    html += '</div></div>';
    return html;
  }

  var out = '';

  if (activeFilter === 'all') {
    // Group by category
    var cats = ['Metabolic Research','Longevity Research','Growth Research','Cognitive Research'];
    cats.forEach(function(cat) {
      var items = PRODUCTS.filter(function(p){ return p.category === cat; });

    list.forEach(function(p) {
      out += cardHTML(p, PRODUCTS.indexOf(p));

}

function openCart() {

}
function closeCart() {

  document.getElementById('cart-drawer').classList.remove('open');

function removeItem(id) { delete cart[id]; updateCartBtn(); renderCart(); }
function renderCart() {
  var itemsEl = document.getElementById('cart-items');
  var footerEl = document.getElementById('cart-footer-wrap');
  var totalEl = document.getElementById('cart-total-amt');
  var keys = Object.keys(cart);
  if (!keys.length) {
    itemsEl.innerHTML = '<div class="cart-empty">Your cart is empty</div>';
    if (footerEl) footerEl.style.display = 'none';
    return;
  }
  var out = ''; var total = 0;
  keys.forEach(function(id) {
    var p = PRODUCTS.find(function(x){ return x.id === id; });
    if (!p) return;
    var qty = cart[id] || 1;
    var lineTotal = p.price * qty;
    total += lineTotal;
    out += '<div class="cart-item">';
    out += '<div class="cart-item-img">' + (p.img ? '<img src="' + p.img + '" alt="' + p.name + '">' : '') + '</div>';
    out += '<div class="cart-item-info">';
    out += '<div class="cart-item-name">' + p.name + '</div>';
    out += '<div class="cart-item-dose">' + p.dose + '</div>';
    out += '<div class="cart-item-qty">';
    out += '<button class="cart-qty-btn" data-id="' + id + '" data-d="-1" onclick="changeQty(this.dataset.id,parseInt(this.dataset.d))">−</button>';
    out += '<span class="cart-qty-num">' + qty + '</span>';
    out += '<button class="cart-qty-btn" data-id="' + id + '" data-d="1" onclick="changeQty(this.dataset.id,parseInt(this.dataset.d))">+</button>';
    out += '</div></div>';
    out += '<div class="cart-item-right">';
    out += '<div class="cart-item-price">CA$' + lineTotal + '</div>';
    out += '<button class="cart-remove" data-id="' + id + '" onclick="removeItem(this.dataset.id)" aria-label="Remove">✕</button>';
    out += '</div></div>';
  });
  itemsEl.innerHTML = out;
  var shipping = total >= 500 ? 0 : 25;
  var grandTotal = total + shipping;
  var subtotalEl = document.getElementById('cart-subtotal-amt');
  var shippingEl = document.getElementById('cart-shipping-amt');
  if (subtotalEl) subtotalEl.textContent = 'CA$' + total;
  if (shippingEl) shippingEl.textContent = shipping === 0 ? 'Free (over CA$500)' : 'CA$25';
  if (totalEl) totalEl.textContent = 'CA$' + grandTotal;
  if (footerEl) footerEl.style.display = 'block';
}

function changeQty(id, delta) {
  cart[id] = (cart[id] || 1) + delta;
  if (cart[id] <= 0) delete cart[id];
  updateCartBtn();
  renderCart();
}
function removeItem(id) {
  delete cart[id];
  updateCartBtn();
  renderCart();
}

async function submitOrder() {
  var name    = (document.getElementById('co-name')||{}).value||'';
  var email   = (document.getElementById('co-email')||{}).value||'';
  var address = (document.getElementById('co-address')||{}).value||'';
  var city    = (document.getElementById('co-city')||{}).value||'';
  var prov    = (document.getElementById('co-province')||{}).value||'';
  var postal  = (document.getElementById('co-postal')||{}).value||'';
  var phone   = (document.getElementById('co-phone')||{}).value||'';
  var pw      = (document.getElementById('co-password')||{}).value||'';
  if (!name.trim()||!email.trim()||!address.trim()||!city.trim()||!prov||!postal.trim()) {
    alert('Please fill in all required fields.'); return;
  }
  var sub = getCartSubtotal();
  var btn = document.querySelector('.co-submit-btn');
  if (btn) { btn.textContent='Placing order...'; btn.disabled=true; }
  try {
    var r = await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name.trim(),email:email.trim(),address:address.trim(),city:city.trim(),
        province:prov,postal:postal.trim(),phone:phone.trim(),password:pw,
        items:getCartItems(),subtotal:sub,payment_method:_payMethod})});
    var data = await r.json();
    if (!data.ok) throw new Error(data.error||'Order failed');
    if (data.sessionToken) {
      document.cookie='peppy_customer='+data.sessionToken+';path=/;max-age=2592000';
      _customerName = name.trim();
    }
    cart={}; updateCartBtn();
    var t=document.getElementById('toast'); if(t){t.classList.remove('show');t.textContent='';}
    showOrderConfirmation(data.ref,data.payment_address,data.total,data.shipping,_payMethod);
  } catch(e) {
    var errEl = document.getElementById('co-error');
    if (errEl) { errEl.textContent=e.message; errEl.style.display='block'; } else { alert('Error: '+e.message); }
    if (btn) { btn.textContent='Place Order'; btn.disabled=false; }
  }
}

async function lookupOrder() {
  var ref   = (document.getElementById('track-ref')||{}).value||'';
  var email = (document.getElementById('track-email')||{}).value||'';
  var el    = document.getElementById('track-result');
  if (!ref.trim()) { el.innerHTML='<p style="color:#888">Please enter an order reference number.</p>'; return; }
  el.innerHTML='<p style="color:#888">Looking up order...</p>';
  try {
    var r = await fetch('/api/order/'+encodeURIComponent(ref.trim())+'?email='+encodeURIComponent(email.trim()));
    var d = await r.json();
    if (!d.ok) { el.innerHTML='<p style="color:#EF4444">Order not found. Check your reference number and try again.</p>'; return; }

function getCartSubtotal() {
  return Object.keys(cart).reduce(function(t,id){
    var p = PRODUCTS.find(function(x){ return x.id===id; });
    return t + (p ? p.price*(cart[id]||1) : 0);
  }, 0);
}
function getCartItems() {
  return Object.keys(cart).map(function(id) {
    var p = PRODUCTS.find(function(x){ return x.id===id; });
    return p ? {id:p.id,name:p.name,dose:p.dose,price:p.price,qty:cart[id]||1} : null;
  }).filter(Boolean);
}

async function submitOrder() {
  var name    = (document.getElementById('co-name')||{}).value||'';
  var email   = (document.getElementById('co-email')||{}).value||'';
  var address = (document.getElementById('co-address')||{}).value||'';
  var city    = (document.getElementById('co-city')||{}).value||'';
  var prov    = (document.getElementById('co-province')||{}).value||'';
  var postal  = (document.getElementById('co-postal')||{}).value||'';
  var phone   = (document.getElementById('co-phone')||{}).value||'';
  var errEl = document.getElementById('co-error');
  if (!name.trim()||!email.trim()||!address.trim()||!city.trim()||!prov||!postal.trim()) {
    if(errEl){errEl.textContent='Please fill in all required fields.';errEl.style.display='block';}
    return;
  }
  var sub = getCartSubtotal();
  var btn = document.querySelector('.co-submit-btn');
  if (btn) { btn.textContent='Placing order...'; btn.disabled=true; }
  try {
    var r = await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name.trim(),email:email.trim(),address:address.trim(),
        city:city.trim(),province:prov,postal:postal.trim(),phone:phone.trim(),
        items:getCartItems(),subtotal:sub,payment_method:_payMethod})});
    var data = await r.json();
    if (!data.ok) throw new Error(data.error||'Order failed');
    cart={}; updateCartBtn();
    showPage('confirmation');
    showOrderConfirmation(data.ref, data.payment_address, data.total, data.shipping, _payMethod);
  } catch(e) {
    if(errEl){errEl.textContent='Error: '+e.message;errEl.style.display='block';}
    if(btn){btn.textContent='Place Order →';btn.disabled=false;}
  }
}
function showOrderConfirmation(ref, payAddr, total, shipping, method) {
  var el = document.getElementById('confirmation-content');

}

function openNotify(productId, productName) {
  _notifyProductId = productId;
  document.getElementById('notify-product-label').textContent = 'We\'ll email you when ' + productName + ' is back in stock.';
  document.getElementById('notify-email').value = '';
  var m = document.getElementById('notify-modal');
  m.style.display = 'flex';
  setTimeout(function(){ document.getElementById('notify-email').focus(); }, 100);
}
async function submitNotify() {
  var email = document.getElementById('notify-email').value.trim();
  if (!email || !email.includes('@')) { alert('Please enter a valid email.'); return; }
  var r = await fetch('/api/notify', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ product_id: _notifyProductId, email: email }) });
  var data = await r.json();
  if (data.ok) {
    document.getElementById('notify-modal').style.display = 'none';
    alert('You\'re on the list! We\'ll email you when it\'s back.');
  }
}
document.getElementById('notify-modal').addEventListener('click', function(e) {
  if (e.target === this) this.style.display = 'none';
});
